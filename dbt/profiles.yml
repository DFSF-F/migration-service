migration_service_dbt:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      keyfile: /app/secrets/gcp/service-account.json
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: hr_dds
      threads: 4
      timeout_seconds: 300
      location: "{{ env_var('GCP_REGION') }}"
      priority: interactive
      retries: 1